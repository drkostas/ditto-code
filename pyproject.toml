[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ditto-code"
version = "0.5.0"
description = "Run Claude Code on a local model through Ollama, choosing the largest model that fits in the memory free right now"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Konstantinos Georgiou" }]
dependencies = []
keywords = ["claude-code", "ollama", "local-llm", "qwen", "proxy", "agents"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Software Development", "Topic :: Utilities"]

[project.urls]
Homepage = "https://github.com/drkostas/ditto-code"

[project.scripts]
ditto-code = "ditto_code.cli:main"
understudy = "ditto_code.cli:old_name"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ditto_code = ["skills/*/SKILL.md"]
